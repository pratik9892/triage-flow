# Supabase pauses free projects after 7 days without database activity.
# This runs a tiny query twice a week so the live demo stays up.
# Needs one repository secret: SUPABASE_DB_URL (Session pooler connection string).
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 * * 1,4"   # 08:47 IST every Monday and Thursday
  workflow_dispatch:          # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "select count(*) as tickets from tickets;"
